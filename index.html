<!DOCTYPE html>
<html>
<head>
    <meta charset ="UTF-8">
    <title>Alyssa's Sports Analytics Website</title>
    <style>
        body {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            margin: 20px;
            font-size: xx-large;
            background-color: #E2E6F3;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .stat-column {
            flex: 1;
            background-color: #3C91E6;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-column h2 {
            font-size: 2rem;
            margin: 0;
            color: black;
        }
        .stat-column p {
            font-size: 1rem;
            margin: 5px 0 0;
            color: black;
        }
        button {
            padding: 10px;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Sports Stats</h1>

    <div class="stats-container">
        <div class="stat-column">
            <h2>PGA</h2>
            <p>Live Scoreboard</p>
            <img src="https://alyssas-sports-analytics.onrender.com/pga-chart.png" alt="PGA Chart" style="width: 100%; max-width: 400px; border-radius: 4px; margin-top: 10px;">
        </div>
        
        <div class="stat-column">
            <h2>NBA</h2>
            <p>Leaderboard</p>
            <img src="https://alyssas-sports-analytics.onrender.com/nba-chart.png" alt="NBA Chart" style="width: 100%; max-width: 400px; border-radius: 4px; margin-top: 10px;">
        </div>
        
        <div class="stat-column">
            <h2>NFL</h2>
            <p>Leaderboard</p>
            <div style="background-color: #ffffff; padding: 40px 10px; border-radius: 4px; font-size: 1.2rem; margin-top: 10px; color: #555;">
                NFL Chart Pipeline Coming Soon!
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <button onclick="window.location.reload()" style="padding: 15px 30px; font-size: 1.2rem;">Refresh Dashboard Statistics</button>
    </div>
</body>
</html>
