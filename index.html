<!DOCTYPE html>
<html>
<head>
    <meta charset ="UTF-8">
    <title>Alyssa's Sports Analytics Website</title>
    <style>
        body {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            margin: 20px;
            font-size: xx-large;
            background-color: #E2E6F3;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .stat-column {
            flex: 1;
            background-color: #3C91E6;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-column h2 {
            font-size: 2rem;
            margin: 0;
            color: black;
        }
        .stat-column p {
            font-size: 1rem;
            margin: 5px 0 0;
            color: black;
        }
        button {
            padding: 10px;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
        }
        .news-section {
            margin-top: 40px;
        }
        .news-section h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        .news-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .news-article {
            background-color: #AEC9A6;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .news-article h3 {
            margin: 0 0 10px 0;
            color: #3C91E6;
            font-size: 1.5rem;
        }
        .news-article .news-meta {
                font-size: 0.8rem;
                color: #666;
                margin-bottom: 10px;
        }
        .news-article p {
            font-size: 1rem;
            line-height: 1.6;
            color: #333;
        }
        
    </style>
</head>
<body>
    <h1>Sports Stats</h1>

    <div class="stats-container">
        <div class="stat-column">
            <h2>PGA</h2>
            <button onclick="loadPGAData()">Load PGA Data</button>
            <div id ="pga-data"></div>
        </div>
        
        <div class="stat-column">
            <h2>NBA</h2>
            <p>Leaderboard</p>
            <img src="https://alyssas-sports-analytics.onrender.com/nba-chart.png" alt="NBA Chart" style="width: 100%; max-width: 400px; border-radius: 4px; margin-top: 10px;">
        </div>
        
        <div class="stat-column">
            <h2>NFL</h2>
            <p>Leaderbord</p>
            <button onclick="loadNFLData()">Load NFL Data</button>
            <div id ="nfl-data"></div>
            <button onclick="loadNFLStandings()">Load Season Standings</button>
            <div id ="nfl-standings"></div>
        </div>
    </div>

    <div class="news-section">
        <h2>Top Sports News</h2>
        <button onclick="loadAllNews()" style="display: block; margin: 0 auto 20px; padding: 15px 30px; font-size: 1.2rem;">Load Latest News</button>
        <div class="news-container">
            <div class="news-article">
                <h3>PGA News</h3>
                <div id="pga-news">Click "Load Latest News" to see articles</div>
            </div>
            <div class="news-article">
                <h3>NBA News</h3>
                <div id="nba-news">Click "Load Latest News" to see articles</div>
            </div>
            <div class="news-article">
                <h3>NFL News</h3>
                <div id="nfl-news">Click "Load Latest News" to see articles</div>
            </div>
        </div>
    </div>

    <script>
        function loadAllNews() {
            document.getElementById('pga-news').innerHTML = '<p>Loading...</p>';
            document.getElementById('nba-news').innerHTML = '<p>Loading...</p>';
            document.getElementById('nfl-news').innerHTML = '<p>Loading...</p>';

            // Updated to point directly to your live backend server
            fetch('https://alyssas-sports-analytics.onrender.com/news')
                .then(response => response.json())
                .then(articles => {
                    displayCustomNews(articles, 'PGA', 'pga-news');
                    displayCustomNews(articles, 'NBA', 'nba-news');
                    displayCustomNews(articles, 'NFL', 'nfl-news');
                })
                .catch(error => {
                    console.error('Error fetching backend news:', error);
                    document.getElementById('pga-news').innerHTML = '<p>Error loading news</p>';
                    document.getElementById('nba-news').innerHTML = '<p>Error loading news</p>';
                    document.getElementById('nfl-news').innerHTML = '<p>Error loading news</p>';
                });
        }

        function displayCustomNews(articles, sportType, elementId) {
            const newsDiv = document.getElementById(elementId);
            const article = articles.find(a => a.sport === sportType);
            
            if (article) {
                let html = `
                    <div class="news-meta">Live Update</div>
                    <p style="font-weight: bold; font-size: 1.2rem; margin-bottom: 10px;">${article.title}</p>
                    <p style="font-size: 0.9rem;">Source: Python Flask Backend Pipeline</p>
                `;
                newsDiv.innerHTML = html;
            } else {
                newsDiv.innerHTML = '<p>No news available for this sport</p>';
            }
        }
    </script>
</body>
</html>
